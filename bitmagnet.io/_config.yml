title: bitmagnet
tagline: "自托管的 BitTorrent 索引器、DHT 爬虫、内容分类器和种子搜索引擎"
description: "一个带有 Web UI、GraphQL API 和 Servarr 集成的自托管 BitTorrent 索引器、DHT 爬虫、内容分类器和种子搜索引擎。"
baseurl: ""
url: "https://bitmagnet.zituoguan.com"
markdown: kramdown
theme: just-the-docs
callouts_level: quiet # 或 loud
callouts:
  highlight:
    color: yellow
  important:
    title: 重要
    color: blue
  new:
    title: 新
    color: green
  note:
    title: 注
    color: purple
  warning:
    title: 警告
    color: red
nav_external_links:
  - title: Discord
    url: https://discord.gg/6mFNszX8qM
  - title: GitHub
    url: https://github.com/bitmagnet-io/bitmagnet
  - title: OpenCollective
    url: https://opencollective.com/bitmagnet
favicon_ico: "/assets/images/favicon.png"
plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-target-blank
